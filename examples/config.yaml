# MCPShield demo configuration — used by docker-compose.yaml.
# auth.type: none means all requests are accepted (suitable for local demo only).
# See README.md for API key setup.

server:
  listen: ":8080"
  request_timeout: "60s"         # default: 60s
  read_timeout: "30s"            # default: 30s
  write_timeout: "30s"           # default: 30s
  idle_timeout: "120s"           # default: 120s
  max_request_bytes: 1048576     # default: 1 MiB
  warmup_timeout: "30s"          # default: 30s
  warmup_retry_interval: "5s"    # default: 5s
  session_ttl: "30m"             # default: 30m
  session_max_entries: 10000     # default: 10000

auth:
  type: none  # change to "api_key" and add keys for production use

policy_file: /etc/mcpshield/policy.yaml

upstreams:
  - id: mock
    prefix: mock
    url: http://mock-upstream:9090
    request_timeout: "30s"       # default: 30s
    max_response_bytes: 4194304  # default: 4 MiB
    tools_cache_ttl: "10s"       # default: 10s
    refresh_timeout: "30s"       # default: 30s

observability:
  metrics:
    enabled: true

audit:
  enabled: false  # set to true with backend: sqlite for production audit logging
